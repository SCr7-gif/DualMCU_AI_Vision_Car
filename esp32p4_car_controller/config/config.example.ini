# 本文件是本地配置示例，不包含真实密钥。
# 复制为 config.local.ini 后再填入真实值。
# config.local.ini 必须被 .gitignore 忽略，不能提交。

[wifi]
ssid = YOUR_WIFI_SSID
password = YOUR_WIFI_PASSWORD

[qwen]
api_key = YOUR_QWEN_API_KEY
model = qwen3-omni-flash-realtime-2025-09-15
endpoint = wss://dashscope.aliyuncs.com/api-ws/v1/realtime

[robot]
max_speed_percent = 60
image_upload_fps = 1
ultrasonic_stop_cm = 15
tilt_min_deg = 30
tilt_max_deg = 150
